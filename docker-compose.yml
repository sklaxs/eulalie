services:
  eulalie:
    build: .
    container_name: eulalie
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # accessible seulement en local ; reverse-proxy pour exposer
    environment:
      - RUST_LOG=eulalie=info
      # En production derrière un reverse proxy HTTPS, définir l'URL publique
      # pour activer les cookies `Secure` :
      # - EULALIE_PUBLIC_URL=https://traduction.exemple.fr
    volumes:
      - eulalie_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  eulalie_data:
