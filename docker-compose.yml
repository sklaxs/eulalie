services:
  eulalie:
    build: .
    container_name: eulalie
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # accessible seulement en local ; reverse-proxy pour exposer
    environment:
      # En production derrière un reverse proxy TLS, laisser vide (cookies Secure).
      # Pour un test en local sans HTTPS : décommenter la ligne suivante.
      # - EULALIE_INSECURE_COOKIES=1
      - RUST_LOG=eulalie=info
    volumes:
      - eulalie_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  eulalie_data:
