[package]
name = "eulalie"
version = "0.1.0"
edition = "2021"
description = "Eulalie — atelier de traduction web (Rust/Axum/SQLite)"
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
tower-sessions = { version = "0.12" }
tower-sessions-sqlx-store = { version = "0.13", features = ["sqlite"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "time"] }
askama = "0.12"
argon2 = { version = "0.5", features = ["std"] }
pulldown-cmark = "0.9"
ammonia = "4"
epub = "2.1"
pdf-extract = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.8"
time = "0.3"
tower = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 2
strip = true
[dev-dependencies]
zip = "2"
